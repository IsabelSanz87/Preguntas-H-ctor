const $=id=>document.getElementById(id);
let deck=[],pos=0,attempts=[];
function start(ids){deck=ids.slice();pos=0;attempts=[];$('result').hidden=true;$('quiz').hidden=false;render(false)}
function render(focus=true){const q=QUESTIONS[deck[pos]];$('position').textContent=`Pregunta ${pos+1} de ${deck.length}`;$('counter').textContent=`${attempts.filter(a=>a.ok).length} aciertos`;$('progress').max=deck.length;$('progress').value=pos;$('section').textContent=q.part===1?'PARTE I · '+q.block:'PARTE II · '+q.block;$('question').textContent=q.q;$('answers').disabled=false;$('options').replaceChildren();$('feedback').hidden=true;$('check').hidden=false;$('check').disabled=true;$('next').hidden=true;
$('instruction').textContent=q.type==='multi'?'Marca todas las correctas. Debes acertar la combinación completa.':q.type==='match'?'Elige una relación para cada estructura. Debes acertar las tres.':'Elige una sola respuesta.';
if(q.type==='match'){q.pairs.forEach((p,i)=>{const label=document.createElement('label');label.className='pair';const span=document.createElement('span');span.textContent=p;const select=document.createElement('select');select.name='pair'+i;select.add(new Option('Selecciona una opción…',''));q.options.forEach((o,j)=>select.add(new Option(o,String(j))));label.append(span,select);$('options').append(label)})}else{q.options.forEach((o,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type=q.type==='multi'?'checkbox':'radio';input.name='answer';input.value=i;const span=document.createElement('span');span.textContent=o;label.append(input,span);$('options').append(label)})}if(focus)$('question').focus();}
function selected(){const q=QUESTIONS[deck[pos]];return q.type==='match'?[...$('options').querySelectorAll('select')].map(s=>s.value===''?-1:Number(s.value)):[...$('options').querySelectorAll('input:checked')].map(s=>Number(s.value))}
$('form').addEventListener('change',()=>{const q=QUESTIONS[deck[pos]],s=selected();$('check').disabled=q.type==='match'?s.includes(-1):s.length===0});
function answerText(q,s){return q.type==='match'?q.pairs.map((p,i)=>`${p} → ${q.options[s[i]]}`).join('; '):s.map(i=>q.options[i]).join('; ')}
$('form').addEventListener('submit',e=>{e.preventDefault();if($('check').disabled||$('check').hidden)return;const q=QUESTIONS[deck[pos]],s=selected();const ok=s.length===q.correct.length&&s.every((v,i)=>v===q.correct[i]);attempts.push({id:deck[pos],selected:s,ok});$('answers').disabled=true;$('check').hidden=true;$('next').hidden=false;$('next').textContent=pos===deck.length-1?'Ver resultado →':'Siguiente pregunta →';$('feedback').className=ok?'good':'bad';$('feedback').replaceChildren();const title=document.createElement('strong');title.textContent=ok?'¡Correcto!':'Esta vez no.';const correct=document.createElement('p');correct.textContent='Respuesta correcta: '+answerText(q,q.correct);const why=document.createElement('p');why.textContent=q.why;const ref=document.createElement('p');ref.className='reference';ref.textContent=q.ref;$('feedback').append(title,correct,why,ref);$('feedback').hidden=false;$('progress').value=pos+1;$('counter').textContent=`${attempts.filter(a=>a.ok).length} aciertos`});
$('next').addEventListener('click',()=>{if(pos<deck.length-1){pos++;render()}else finish()});
function finish(){const n=attempts.filter(a=>a.ok).length;$('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`${n} / ${deck.length}`;$('summary').textContent=`Nota: ${(10*n/deck.length).toFixed(1).replace('.',',')} sobre 10. ${deck.length-n===0?'¡Has acertado todas!':`Tienes ${deck.length-n} preguntas para repasar.`}`;$('mistakes').hidden=n===deck.length;$('review').replaceChildren();attempts.forEach((a,i)=>{const q=QUESTIONS[a.id],d=document.createElement('details'),s=document.createElement('summary');s.textContent=`${a.ok?'✓ Correcta':'✗ Incorrecta'} · ${i+1}. ${q.q}`;d.append(s);for(const text of ['Tu respuesta: '+answerText(q,a.selected),'Respuesta correcta: '+answerText(q,q.correct),q.why,q.ref]){const p=document.createElement('p');p.textContent=text;d.append(p)}$('review').append(d)});$('result-title').focus()}
function chosen(){return QUESTIONS.map((_,i)=>i).filter(i=>$('mode').value==='all'||QUESTIONS[i].part===Number($('mode').value))}
$('begin').addEventListener('click',()=>{start(chosen());$('question').focus()});
$('restart').textContent='Repetir selección';$('restart').addEventListener('click',()=>start(chosen()));$('mistakes').addEventListener('click',()=>start(attempts.filter(a=>!a.ok).map(a=>a.id)));start(QUESTIONS.map((_,i)=>i));
